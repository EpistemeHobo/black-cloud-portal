AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Cloud Developer Portal: active and hibernate modes, and the portal's HTTPS
  address. API Gateway passes the portal's pages to Beanstalk (adding a secret
  header the app checks) and sends /launch and /_wake/* to one Lambda function,
  which also switches modes and puts the portal to sleep when idle. (No
  CloudFront: Learner Lab doesn't allow it.) Deploy steps: docs/aws-learner-lab.md,
  "Active and hibernate modes".

Parameters:
  EnvironmentName:
    Type: String
    Description: The Beanstalk environment's name, e.g. Cloud-dev-portal-env
  EnvironmentCname:
    Type: String
    Description: The Beanstalk environment's domain, e.g. cloud-dev-portal.us-east-1.elasticbeanstalk.com
  OriginVerifySecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: The same value as the app's ORIGIN_VERIFY_SECRET; requests without it are refused by the app
  DbClusterId:
    Type: String
    Default: portal-db
  IdleMinutes:
    Type: Number
    Default: 30
    Description: In hibernate mode, sleep after this many minutes without visitors
  InitialMode:
    Type: String
    Default: hibernate
    AllowedValues: [active, hibernate]
  NightlyStopSchedule:
    Type: String
    Default: cron(0 17 * * ? *)
    Description: When to switch to hibernate and stop everything, in UTC. The default is midnight in Thailand (UTC+7)

Resources:
  # The current mode. The function overwrites it when you switch.
  ModeParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cloud-dev-portal/mode
      Type: String
      Value: !Ref InitialMode
      Tags: {Project: cloud-dev-portal, Environment: dev}

  ModeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cloud-dev-portal-mode
      Description: Switches the portal between active and hibernate, wakes it on a visit, sleeps it when idle
      Runtime: python3.12
      Handler: handler.lambda_handler
      Code: portal_mode/   # uploaded by `aws cloudformation package`
      # Learner Lab can't create roles; LabRole is the one every lab account has.
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          DB_CLUSTER_ID: !Ref DbClusterId
          EB_ENVIRONMENT: !Ref EnvironmentName
          PARAM_PREFIX: /cloud-dev-portal
          IDLE_MINUTES: !Ref IdleMinutes
      Tags:
        - {Key: Project, Value: cloud-dev-portal}
        - {Key: Environment, Value: dev}

  # Every 15 minutes: in hibernate mode, put an idle portal to sleep.
  TickRule:
    Type: AWS::Events::Rule
    Properties:
      Name: cloud-dev-portal-tick
      ScheduleExpression: rate(15 minutes)
      Targets:
        - Id: mode-function
          Arn: !GetAtt ModeFunction.Arn
          Input: '{"action": "tick"}'
  TickPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ModeFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt TickRule.Arn

  # Every night: switch to hibernate and stop everything, whatever the mode, in
  # case active mode was left on after a presentation. Same message as the switch.
  NightlyRule:
    Type: AWS::Events::Rule
    Properties:
      Name: cloud-dev-portal-nightly-stop
      ScheduleExpression: !Ref NightlyStopSchedule
      Targets:
        - Id: mode-function
          Arn: !GetAtt ModeFunction.Arn
          Input: '{"mode": "hibernate"}'
  NightlyPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ModeFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NightlyRule.Arn

  # The portal's HTTPS address. Its pages go to Beanstalk; /launch (the link to
  # share) and the waking-up page's /_wake calls go to the function.
  WakeApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: cloud-dev-portal-wake
      ProtocolType: HTTP
      Tags: {Project: cloud-dev-portal, Environment: dev}
  # Passes requests on to the app over HTTP, overwriting X-Origin-Verify so the
  # app knows they came through here (a browser can't fake it).
  AppIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WakeApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Sub http://${EnvironmentCname}/{proxy}
      PayloadFormatVersion: "1.0"
      RequestParameters:
        overwrite:header.x-origin-verify: !Ref OriginVerifySecret
  AppRootIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WakeApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Sub http://${EnvironmentCname}/
      PayloadFormatVersion: "1.0"
      RequestParameters:
        overwrite:header.x-origin-verify: !Ref OriginVerifySecret
  AppRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WakeApi
      RouteKey: ANY /{proxy+}
      Target: !Sub integrations/${AppIntegration}
  AppRootRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WakeApi
      RouteKey: ANY /
      Target: !Sub integrations/${AppRootIntegration}
  WakeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WakeApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ModeFunction.Arn
      PayloadFormatVersion: "2.0"
  LaunchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WakeApi
      RouteKey: ANY /launch
      Target: !Sub integrations/${WakeIntegration}
  WakeCallsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WakeApi
      RouteKey: ANY /_wake/{proxy+}
      Target: !Sub integrations/${WakeIntegration}
  # A page load fetches ~20 files, so the portal gets room; the routes that run
  # the function (and can start servers) are kept tight.
  WakeStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn: [LaunchRoute, WakeCallsRoute]
    Properties:
      ApiId: !Ref WakeApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: 50
        ThrottlingBurstLimit: 100
      RouteSettings:
        ANY /launch: {ThrottlingRateLimit: 5, ThrottlingBurstLimit: 10}
        ANY /_wake/{proxy+}: {ThrottlingRateLimit: 5, ThrottlingBurstLimit: 10}
  WakePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ModeFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WakeApi}/*

Outputs:
  PortalUrl:
    Description: The portal's HTTPS address; set it as PUBLIC_BASE_URL in Beanstalk
    Value: !GetAtt WakeApi.ApiEndpoint
  LauncherUrl:
    Description: The link to share; it wakes the portal first if it sleeps
    Value: !Sub ${WakeApi.ApiEndpoint}/launch
  ModeFunctionName:
    Value: !Ref ModeFunction
