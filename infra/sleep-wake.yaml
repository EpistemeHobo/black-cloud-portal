AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Cloud Developer Portal: active and hibernate modes. One Lambda function switches
  modes, puts the portal to sleep when idle, and behind API Gateway serves the
  launcher link, which wakes the portal and forwards to it. (No CloudFront:
  Learner Lab doesn't allow it.) Deploy steps: docs/aws-learner-lab.md,
  "Active and hibernate modes".

Parameters:
  EnvironmentName:
    Type: String
    Description: The Beanstalk environment's name, e.g. Cloud-dev-portal-env
  DbClusterId:
    Type: String
    Default: portal-db
  IdleMinutes:
    Type: Number
    Default: 30
    Description: In hibernate mode, sleep after this many minutes without visitors
  InitialMode:
    Type: String
    Default: hibernate
    AllowedValues: [active, hibernate]

Resources:
  # The current mode. The function overwrites it when you switch.
  ModeParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cloud-dev-portal/mode
      Type: String
      Value: !Ref InitialMode
      Tags: {Project: cloud-dev-portal, Environment: dev}

  ModeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cloud-dev-portal-mode
      Description: Switches the portal between active and hibernate, wakes it on a visit, sleeps it when idle
      Runtime: python3.12
      Handler: handler.lambda_handler
      Code: portal_mode/   # uploaded by `aws cloudformation package`
      # Learner Lab can't create roles; LabRole is the one every lab account has.
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          DB_CLUSTER_ID: !Ref DbClusterId
          EB_ENVIRONMENT: !Ref EnvironmentName
          PARAM_PREFIX: /cloud-dev-portal
          IDLE_MINUTES: !Ref IdleMinutes
      Tags:
        - {Key: Project, Value: cloud-dev-portal}
        - {Key: Environment, Value: dev}

  # Every 15 minutes: in hibernate mode, put an idle portal to sleep.
  TickRule:
    Type: AWS::Events::Rule
    Properties:
      Name: cloud-dev-portal-tick
      ScheduleExpression: rate(15 minutes)
      Targets:
        - Id: mode-function
          Arn: !GetAtt ModeFunction.Arn
          Input: '{"action": "tick"}'
  TickPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ModeFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt TickRule.Arn

  # The launcher link: forwards to the portal, or shows the waking-up page and
  # its /_wake calls. Anyone with the link can call it; the throttle caps how often.
  WakeApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: cloud-dev-portal-wake
      ProtocolType: HTTP
      Tags: {Project: cloud-dev-portal, Environment: dev}
  WakeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WakeApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ModeFunction.Arn
      PayloadFormatVersion: "2.0"
  WakeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WakeApi
      RouteKey: $default
      Target: !Sub integrations/${WakeIntegration}
  WakeStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WakeApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10
  WakePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ModeFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WakeApi}/*

Outputs:
  LauncherUrl:
    Description: Share this link to open the portal; it wakes the portal first if it sleeps
    Value: !GetAtt WakeApi.ApiEndpoint
  ModeFunctionName:
    Value: !Ref ModeFunction
